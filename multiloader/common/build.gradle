plugins {
    id 'dev.architectury.loom-no-remap'
}

base {
    archivesName = "${mod_id}-common"
}

dependencies {
    // 只依赖原版 Minecraft，编译期即可保证 common 不引入任何加载器 API
    minecraft "com.mojang:minecraft:${minecraft_version}"
}

// common 不产出可运行的运行配置，仅供 forge / neoforge 依赖
loom {
    runs {
        // 保留空配置块以避免 Loom 生成默认运行任务
    }
}
