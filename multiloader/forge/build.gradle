plugins {
    id 'dev.architectury.loom-no-remap'
}

base {
    archivesName = "${mod_id}-forge"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    forge "net.minecraftforge:forge:${forge_version}"

    implementation project(':common')
}

loom {
    runs {
        client {
            client()
            name = 'Forge Client'
        }
        server {
            server()
            name = 'Forge Server'
        }
    }
}
